name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - "v*-i18n.*"
  workflow_dispatch:
    inputs:
      build_mode:
        description: "universal ships one build per platform/arch; per-language is the legacy rollback path."
        required: false
        type: choice
        options:
          - universal
          - per-language
        default: universal
      languages:
        description: "Comma-separated locales to build in per-language mode, or all. Universal mode always validates every enabled locale."
        required: false
        default: "all"
      platforms:
        description: "Comma-separated platform ids/families, or all. Example: linux-x86_64,macos,windows-aarch64"
        required: false
        default: "all"
      shard_size:
        description: "How many locales to build sequentially in one platform job."
        required: false
        default: "1"
      upload_to_release:
        description: "Upload artifacts to a draft GitHub Release. Manual runs need release_tag unless running on a tag."
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag for manual uploads. Tag pushes use the pushed tag."
        required: false
        default: ""
      distribution_patches:
        description: "Apply zed-i18n About, identity, and updater patches during release builds."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: localized-zed-release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      linux-matrix: ${{ steps.matrix.outputs.linux-matrix }}
      macos-matrix: ${{ steps.matrix.outputs.macos-matrix }}
      windows-matrix: ${{ steps.matrix.outputs.windows-matrix }}
      languages: ${{ steps.matrix.outputs.languages }}
      zed-version: ${{ steps.matrix.outputs.zed-version }}
      build-count: ${{ steps.matrix.outputs.build-count }}
      linux-build-count: ${{ steps.matrix.outputs.linux-build-count }}
      macos-build-count: ${{ steps.matrix.outputs.macos-build-count }}
      windows-build-count: ${{ steps.matrix.outputs.windows-build-count }}
      linux-builder-image: ${{ steps.linux-builder.outputs.image }}
      linux-builder-digest: ${{ steps.linux-builder.outputs.digest }}
      linux-builder-context-sha256: ${{ steps.linux-builder-contract.outputs.context-sha256 }}
    steps:
      - name: Checkout zed-i18n
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Generate matrix
        id: matrix
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'universal' }}
          LANGUAGES: ${{ inputs.languages || 'all' }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
          SHARD_SIZE: ${{ inputs.shard_size || '1' }}
          ZED_I18N_RUNNER_LINUX_X86_64: ${{ vars.ZED_I18N_RUNNER_LINUX_X86_64 || '' }}
          ZED_I18N_RUNNER_LINUX_AARCH64: ${{ vars.ZED_I18N_RUNNER_LINUX_AARCH64 || '' }}
          ZED_I18N_RUNNER_MACOS_X86_64: ${{ vars.ZED_I18N_RUNNER_MACOS_X86_64 || '' }}
          ZED_I18N_RUNNER_MACOS_AARCH64: ${{ vars.ZED_I18N_RUNNER_MACOS_AARCH64 || '' }}
          ZED_I18N_RUNNER_WINDOWS_X86_64: ${{ vars.ZED_I18N_RUNNER_WINDOWS_X86_64 || '' }}
          ZED_I18N_RUNNER_WINDOWS_AARCH64: ${{ vars.ZED_I18N_RUNNER_WINDOWS_AARCH64 || '' }}
        run: |
          uv run python -m tools.zed_i18n.ci_release matrix \
            --mode "$BUILD_MODE" \
            --languages "$LANGUAGES" \
            --platforms "$PLATFORMS" \
            --shard-size "$SHARD_SIZE" >> "$GITHUB_OUTPUT"

      - name: Resolve Linux builder contract
        id: linux-builder-contract
        if: steps.matrix.outputs.linux-build-count != '0'
        run: uv run python -m tools.zed_i18n.linux_builder outputs >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.matrix.outputs.linux-build-count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Resolve immutable Linux builder image
        id: linux-builder
        if: steps.matrix.outputs.linux-build-count != '0'
        shell: bash
        env:
          TAGGED_IMAGE: ${{ steps.linux-builder-contract.outputs.tagged-image }}
        run: |
          set -euo pipefail
          if ! manifest="$(docker buildx imagetools inspect "$TAGGED_IMAGE" --format '{{json .Manifest}}')"; then
            echo "Linux builder image is not available: $TAGGED_IMAGE" >&2
            echo "Publish it first with the 'Publish Linux builder image' workflow for this commit." >&2
            exit 1
          fi
          printf '%s' "$manifest" \
            | uv run python -m tools.zed_i18n.linux_builder resolve-manifest >> "$GITHUB_OUTPUT"

      - name: Summarize matrix
        run: |
          echo "Zed version: ${{ steps.matrix.outputs.zed-version }}"
          echo "Languages: ${{ steps.matrix.outputs.languages }}"
          echo "Build jobs: ${{ steps.matrix.outputs.build-count }}"
          echo "Linux build jobs: ${{ steps.matrix.outputs.linux-build-count }}"
          echo "macOS build jobs: ${{ steps.matrix.outputs.macos-build-count }}"
          echo "Windows build jobs: ${{ steps.matrix.outputs.windows-build-count }}"
          if [[ "${{ steps.matrix.outputs.linux-build-count }}" != "0" ]]; then
            echo "Linux builder: ${{ steps.linux-builder.outputs.image }}"
          fi

  validate:
    name: Validate translations
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout zed-i18n
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Validate selected locales
        env:
          LANGUAGES: ${{ needs.prepare.outputs.languages }}
        run: |
          IFS=',' read -ra LOCALES <<< "$LANGUAGES"
          for locale in "${LOCALES[@]}"; do
            uv run zed-i18n validate --language "$locale"
          done

      - name: Fetch Zed source for patch contract tests
        run: uv run zed-i18n fetch-zed

      - name: Validate Zed patch contracts
        env:
          ZED_I18N_REQUIRE_ZED_PATCH_CONTRACT: "1"
          ZED_I18N_PATCH_CONTRACT_ZED_ROOT: .cache/zed/${{ needs.prepare.outputs.zed-version }}
        run: uv run python -m unittest tests.test_zed_patch_contracts

      - name: Validate universal apply contract
        if: ${{ (inputs.build_mode || 'universal') == 'universal' }}
        env:
          ZED_I18N_REQUIRE_UNIVERSAL_CONTRACT: "1"
          ZED_I18N_UNIVERSAL_CONTRACT_ZED_ROOT: .cache/zed/${{ needs.prepare.outputs.zed-version }}
        run: uv run python -m unittest tests.test_universal_apply_contracts

  build-linux:
    name: Build Linux ${{ matrix.id }}
    needs:
      - prepare
      - validate
    if: ${{ needs.prepare.outputs['linux-build-count'] != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare.outputs['linux-matrix']) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      ZED_I18N_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name || '' }}
      ZED_I18N_REPOSITORY: ${{ github.repository }}
      DISTRIBUTION_PATCHES_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.distribution_patches }}
      LINUX_BUILDER_IMAGE: ${{ needs.prepare.outputs.linux-builder-image }}
      ZED_VERSION: ${{ needs.prepare.outputs.zed-version }}
    steps:
      - name: Checkout zed-i18n
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Configure Rust cache environment
        id: rust-cache
        run: uv run python -m tools.zed_i18n.ci_release rust-cache-env --platform "${{ matrix.platform }}"

      - name: Record initial disk space
        run: uv run python -m tools.zed_i18n.ci_release disk-summary --label "initial"

      - name: Clean Linux runner disk
        shell: bash
        run: |
          df -h "$GITHUB_WORKSPACE"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          docker system prune --all --force || true
          df -h "$GITHUB_WORKSPACE"

      - name: Record disk space after Linux cleanup
        run: uv run python -m tools.zed_i18n.ci_release disk-summary --label "after-linux-cleanup"

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull and validate Linux builder
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$LINUX_BUILDER_IMAGE"
          case "${{ matrix.arch }}" in
            x86_64) expected_platform="linux/amd64" ;;
            aarch64) expected_platform="linux/arm64" ;;
            *) echo "Unsupported Linux architecture: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          actual_platform="$(docker image inspect "$LINUX_BUILDER_IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          if [[ "$actual_platform" != "$expected_platform" ]]; then
            echo "Expected builder platform $expected_platform, got $actual_platform" >&2
            exit 1
          fi
          docker image inspect "$LINUX_BUILDER_IMAGE" --format '{{json .Config.Labels}}' \
            | uv run python -m tools.zed_i18n.linux_builder validate-labels
          echo "Using Linux builder $LINUX_BUILDER_IMAGE ($actual_platform)" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch Zed source
        run: uv run zed-i18n fetch-zed

      - name: Cache Rust dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ steps.rust-cache.outputs.cargo-home }}/registry/index
            ${{ steps.rust-cache.outputs.cargo-home }}/registry/cache
            ${{ steps.rust-cache.outputs.cargo-home }}/git/db
          key: zed-rust-deps-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('.cache/zed/**/Cargo.lock', '.cache/zed/**/rust-toolchain.toml') }}
          restore-keys: |
            zed-rust-deps-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-
            zed-rust-deps-${{ runner.os }}-${{ matrix.platform }}-

      - name: Build and verify localized artifacts in container
        shell: bash
        run: |
          set -euo pipefail
          container_home="$RUNNER_TEMP/zed-i18n-container-home"
          cargo_home="${{ steps.rust-cache.outputs.cargo-home }}"
          mkdir -p "$container_home" "$cargo_home"
          docker run --rm \
            --init \
            --pull never \
            --user "$(id -u):$(id -g)" \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --env "HOME=/home/zed-i18n" \
            --env "CARGO_HOME=/cargo-home" \
            --env "ZED_VERSION=$ZED_VERSION" \
            --env "BUILD_MODE=${{ matrix.mode }}" \
            --env "LANGUAGES=${{ matrix.languages }}" \
            --env "ARCH=${{ matrix.arch }}" \
            --env "BUNDLE_TARGET=${{ matrix.bundle_target }}" \
            --env "DIST_DIR=dist" \
            --env "DISTRIBUTION_PATCHES_ENABLED=$DISTRIBUTION_PATCHES_ENABLED" \
            --env "ZED_I18N_RELEASE_TAG=$ZED_I18N_RELEASE_TAG" \
            --env "ZED_I18N_REPOSITORY=$ZED_I18N_REPOSITORY" \
            --env "CARGO_INCREMENTAL=$CARGO_INCREMENTAL" \
            --env "CARGO_TERM_COLOR=$CARGO_TERM_COLOR" \
            --env "RUST_BACKTRACE=$RUST_BACKTRACE" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "${{ steps.rust-cache.outputs.cargo-home }}:/cargo-home" \
            --volume "$container_home:/home/zed-i18n" \
            --workdir /workspace \
            --entrypoint /usr/local/bin/zed-i18n-run-linux-release \
            "$LINUX_BUILDER_IMAGE"

      - name: Upload shard artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: Build macOS ${{ matrix.id }}
    needs:
      - prepare
      - validate
    if: ${{ needs.prepare.outputs['macos-build-count'] != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare.outputs['macos-matrix']) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
      ZED_I18N_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name || '' }}
      ZED_I18N_REPOSITORY: ${{ github.repository }}
      DISTRIBUTION_PATCHES_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.distribution_patches }}
    steps:
      - name: Checkout zed-i18n
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Configure Rust cache environment
        id: rust-cache
        run: uv run python -m tools.zed_i18n.ci_release rust-cache-env --platform "${{ matrix.platform }}"

      - name: Record initial disk space
        run: uv run python -m tools.zed_i18n.ci_release disk-summary --label "initial"

      - name: Clean macOS CoreSimulator
        shell: bash
        run: sudo rm -rf /Library/Developer/CoreSimulator

      - name: Fetch Zed source
        run: uv run zed-i18n fetch-zed

      - name: Cache Rust dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ steps.rust-cache.outputs.cargo-home }}/registry/index
            ${{ steps.rust-cache.outputs.cargo-home }}/registry/cache
            ${{ steps.rust-cache.outputs.cargo-home }}/git/db
          key: zed-rust-deps-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('.cache/zed/**/Cargo.lock', '.cache/zed/**/rust-toolchain.toml') }}
          restore-keys: |
            zed-rust-deps-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-
            zed-rust-deps-${{ runner.os }}-${{ matrix.platform }}-

      - name: Setup macOS Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Limit Cargo jobs on macOS arm64
        if: matrix.arch == 'aarch64'
        shell: bash
        run: |
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          echo "Limiting Cargo build jobs to 2 for macOS arm64"

      - name: Build localized artifacts
        shell: bash
        run: |
          distribution_args=()
          if [[ "$DISTRIBUTION_PATCHES_ENABLED" == "true" ]]; then
            distribution_args=(--distribution-config config/distribution.toml)
          fi

          uv run python -m tools.zed_i18n.ci_release build-shard \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --bundle-target "${{ matrix.bundle_target }}" \
            --mode "${{ matrix.mode }}" \
            --languages "${{ matrix.languages }}" \
            --dist-dir dist \
            "${distribution_args[@]}"

      - name: Upload shard artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Build Windows ${{ matrix.id }}
    needs:
      - prepare
      - validate
    if: ${{ needs.prepare.outputs['windows-build-count'] != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs['windows-matrix']) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
      ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      CERT_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
      ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      FILE_DIGEST: SHA256
      TIMESTAMP_DIGEST: SHA256
      TIMESTAMP_SERVER: http://timestamp.acs.microsoft.com
      ZED_I18N_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name || '' }}
      ZED_I18N_REPOSITORY: ${{ github.repository }}
      DISTRIBUTION_PATCHES_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.distribution_patches }}
    steps:
      - name: Checkout zed-i18n
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Configure Rust cache environment
        id: rust-cache
        run: uv run python -m tools.zed_i18n.ci_release rust-cache-env --platform "${{ matrix.platform }}"

      - name: Record initial disk space
        run: uv run python -m tools.zed_i18n.ci_release disk-summary --label "initial"

      - name: Fetch Zed source
        run: uv run zed-i18n fetch-zed

      - name: Cache Rust dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ steps.rust-cache.outputs.cargo-home }}/registry/index
            ${{ steps.rust-cache.outputs.cargo-home }}/registry/cache
            ${{ steps.rust-cache.outputs.cargo-home }}/git/db
          key: zed-rust-deps-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('.cache/zed/**/Cargo.lock', '.cache/zed/**/rust-toolchain.toml') }}
          restore-keys: |
            zed-rust-deps-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-
            zed-rust-deps-${{ runner.os }}-${{ matrix.platform }}-

      - name: Build localized artifacts
        shell: bash
        run: |
          distribution_args=()
          if [[ "$DISTRIBUTION_PATCHES_ENABLED" == "true" ]]; then
            distribution_args=(--distribution-config config/distribution.toml)
          fi

          uv run python -m tools.zed_i18n.ci_release build-shard \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --bundle-target "${{ matrix.bundle_target }}" \
            --mode "${{ matrix.mode }}" \
            --languages "${{ matrix.languages }}" \
            --dist-dir dist \
            "${distribution_args[@]}"

      - name: Upload shard artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package release assets
    needs:
      - prepare
      - validate
      - build-linux
      - build-macos
      - build-windows
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.validate.result == 'success' &&
        needs['build-linux'].result != 'failure' &&
        needs['build-linux'].result != 'cancelled' &&
        needs['build-macos'].result != 'failure' &&
        needs['build-macos'].result != 'cancelled' &&
        needs['build-windows'].result != 'failure' &&
        needs['build-windows'].result != 'cancelled'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout zed-i18n
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Download shard artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-artifacts
          pattern: zed-i18n-*
          merge-multiple: true

      - name: Build Debian packages
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${INPUT_RELEASE_TAG:-$GITHUB_REF_NAME}"
          uv run python -m tools.zed_i18n.ci_release build-debs \
            --dist-dir release-artifacts \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY"
          shopt -s nullglob
          debs=(release-artifacts/*.deb)
          for deb in "${debs[@]}"; do
            dpkg-deb --info "$deb" >/dev/null
            dpkg-deb --contents "$deb" >/dev/null
          done
          echo "Validated ${#debs[@]} Debian packages with dpkg-deb"

      - name: Generate manifest and checksums
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          BUILD_MODE: ${{ inputs.build_mode || 'universal' }}
        run: |
          RELEASE_TAG="${INPUT_RELEASE_TAG:-$GITHUB_REF_NAME}"
          uv run python -m tools.zed_i18n.ci_release metadata \
            --dist-dir release-artifacts \
            --manifest release-artifacts/manifest.json \
            --checksums release-artifacts/SHA256SUMS.txt \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --mode "$BUILD_MODE" \
            --languages "${{ needs.prepare.outputs.languages }}" \
            --platforms "${{ inputs.platforms || 'all' }}"

      - name: Generate artifact attestation
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: release-artifacts/*

      - name: Generate draft release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! PREVIOUS_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"; then
            echo "Could not resolve the previous release tag; generating notes without the Full Changelog line."
            PREVIOUS_TAG=""
          fi
          uv run python -m tools.zed_i18n.ci_release release-notes \
            --manifest release-artifacts/manifest.json \
            --output release-artifacts/release-notes.md \
            --previous-tag "$PREVIOUS_TAG"

      - name: Upload combined artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zed-i18n-release-assets
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - package
    if: startsWith(github.ref, 'refs/tags/') || inputs.upload_to_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    environment:
      name: release
    steps:
      - name: Download combined artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: zed-i18n-release-assets
          path: release-artifacts

      - name: Upload to draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" && -z "$INPUT_RELEASE_TAG" ]]; then
            echo "Manual release upload requires the release_tag input."
            exit 1
          fi

          RELEASE_TAG="${INPUT_RELEASE_TAG:-$GITHUB_REF_NAME}"
          mv release-artifacts/release-notes.md release-notes.md
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Release tag does not exist: $RELEASE_TAG"
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi

          gh release upload "$RELEASE_TAG" release-artifacts/* --repo "$GITHUB_REPOSITORY"

      - name: Validate release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          RELEASE_TAG="${INPUT_RELEASE_TAG:-$GITHUB_REF_NAME}"
          find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort > actual-assets.txt
          missing="$(comm -23 expected-assets.txt actual-assets.txt)"
          if [[ -n "$missing" ]]; then
            echo "Missing release assets:"
            echo "$missing"
            exit 1
          fi
          echo "All expected release assets are present."

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          RELEASE_TAG="${INPUT_RELEASE_TAG:-$GITHUB_REF_NAME}"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Update packaging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          RELEASE_TAG="${INPUT_RELEASE_TAG:-$GITHUB_REF_NAME}"
          gh workflow run i18n-update-packaging.yml \
            --repo "$GITHUB_REPOSITORY" \
            --field release_tag="$RELEASE_TAG"
